<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="player">
    <div class="album">
        <img src="https://i.ytimg.com/vi/5GSt99nxiJQ/maxresdefault.jpg" alt="Album Art">
    </div>

    <h2 class="song">Whistle Podu</h2>
    <p class="artist">Studio Beats</p>

    <div class="progress">
        <span></span>
    </div>

    <div class="time">
        <span>1:40</span>
        <span>4:10</span>
    </div>

    <div class="controls">
        <span>⏮</span>
        <span class="play">▶</span>
        <span>⏭</span>
    </div>
</div>

</body>
</html>
